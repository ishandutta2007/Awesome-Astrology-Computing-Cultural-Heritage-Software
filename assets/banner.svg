<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#141829" />
      <stop offset="100%" stop-color="#090c15" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="orbGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="orbGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .star {
      animation: twinkle 3s ease-in-out infinite alternate;
    }
    .star-delay-1 { animation-delay: 0.7s; }
    .star-delay-2 { animation-delay: 1.5s; }
    .star-delay-3 { animation-delay: 2.2s; }

    @keyframes twinkle {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 0.95; transform: scale(1.3); }
    }

    .orbit-ring {
      transform-origin: 1000px 210px;
      animation: rotateRing 36s linear infinite;
    }

    .orbit-ring-reverse {
      transform-origin: 1000px 210px;
      animation: rotateRingRev 28s linear infinite;
    }

    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes rotateRingRev {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    .pulse-glow {
      animation: pulseGlow 6s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { r: 160; opacity: 0.4; }
      100% { r: 210; opacity: 0.7; }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Subtle Constellation Grid Background -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Glowing Orbs (Dynamic Ambient Lighting behind text) -->
  <circle cx="150" cy="120" r="180" fill="url(#orbGrad1)" class="pulse-glow" filter="url(#glow)" />
  <circle cx="950" cy="240" r="220" fill="url(#orbGrad2)" class="pulse-glow" filter="url(#glow)" />

  <!-- Animated Astrological Celestial Wheel (Right Side Background Accent) -->
  <g class="orbit-ring" opacity="0.6">
    <circle cx="1000" cy="210" r="160" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6 8" />
    <circle cx="1000" cy="210" r="125" fill="none" stroke="#ec4899" stroke-width="1" stroke-dasharray="3 6" />
    <!-- Planetary Node Points on Outer Wheel -->
    <circle cx="1000" cy="50" r="5" fill="#a78bfa" filter="url(#starGlow)" />
    <circle cx="1160" cy="210" r="4" fill="#38bdf8" filter="url(#starGlow)" />
    <circle cx="1000" cy="370" r="4.5" fill="#f472b6" filter="url(#starGlow)" />
    <circle cx="840" cy="210" r="4" fill="#fbbf24" filter="url(#starGlow)" />
  </g>

  <g class="orbit-ring-reverse" opacity="0.45">
    <circle cx="1000" cy="210" r="90" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 6" />
    <polygon points="1000,130 1069,250 931,250" fill="none" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.5" />
    <polygon points="1000,290 1069,170 931,170" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="1000" cy="210" r="6" fill="#fbcfe8" filter="url(#starGlow)" />
  </g>

  <!-- Twinkling Stars Pattern -->
  <g filter="url(#starGlow)">
    <circle cx="90" cy="65" r="1.8" fill="#e2e8f0" class="star" />
    <circle cx="210" cy="180" r="2.2" fill="#e2e8f0" class="star star-delay-1" />
    <circle cx="340" cy="80" r="1.5" fill="#e2e8f0" class="star star-delay-2" />
    <circle cx="480" cy="150" r="2" fill="#e2e8f0" class="star star-delay-3" />
    <circle cx="680" cy="60" r="2.5" fill="#e2e8f0" class="star star-delay-1" />
    <circle cx="750" cy="170" r="1.5" fill="#e2e8f0" class="star star-delay-2" />
    <circle cx="820" cy="90" r="2" fill="#e2e8f0" class="star" />
    <circle cx="1120" cy="80" r="2.2" fill="#e2e8f0" class="star star-delay-3" />
    <circle cx="1150" cy="320" r="1.6" fill="#e2e8f0" class="star star-delay-1" />
    <circle cx="590" cy="360" r="1.8" fill="#e2e8f0" class="star star-delay-2" />
    <circle cx="240" cy="340" r="2" fill="#e2e8f0" class="star star-delay-3" />
    <circle cx="80" cy="280" r="1.6" fill="#e2e8f0" class="star" />
  </g>

  <!-- Foreground Content: Clean, Unobscured Hierarchy -->
  <g id="foreground-content" transform="translate(80, 0)">
    <!-- Category Pill -->
    <g transform="translate(0, 68)">
      <rect width="365" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.8" />
      <circle cx="16" cy="16" r="5" fill="#10b981" />
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#c7d2fe" letter-spacing="0.8">AWESOME ASTROLOGY &amp; COMPUTATION</text>
    </g>

    <!-- Main Title (Never obscured) -->
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">
      Awesome Astrology Computing
    </text>
    <text x="0" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#f8fafc" letter-spacing="-0.3">
      &amp; Cultural Heritage Software 🌌
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#94a3b8">
      High-Precision Ephemeris Engines • Natal, Vedic &amp; Zi Wei Dou Shu Charts • Cultural Calendars
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 304)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="168" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#38bdf8">🔭 Swiss Ephemeris</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(180, 0)">
        <rect width="180" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#c084fc">✨ Multi-Tradition Charts</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(372, 0)">
        <rect width="176" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#f472b6">🏛️ Archaeoastronomy</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(560, 0)">
        <rect width="188" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#34d399">📅 Lunisolar Calendars</text>
      </g>
    </g>
  </g>
</svg>
